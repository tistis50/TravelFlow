<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TravelFlow — учёт командировок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1E6FD9;--blue-d:#1559B3;--blue-l:#DCE9F8;--blue-xl:#F2F7FD;--bg:#E2EDF8;--text:#141C26;--muted:#6B7787;--line:#E4E9F0;--line2:#C9D2DC;
  --green:#52BE5C;--grey:#7D8985;--violet:#6E7ED6;--orange:#EFA03A;--red:#E05656;--draft:#AEB8C4;--r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.app{display:flex;min-height:100vh}

.sidebar{width:236px;background:#fff;flex-shrink:0;padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:30}
.logo{display:flex;align-items:center;gap:4px;font-weight:800;font-size:21px;letter-spacing:-.4px;padding:0 4px 30px;color:#111;text-decoration:none}
.logo svg{width:48px;height:34px;flex-shrink:0}
.nav a{display:block;padding:9px 14px;border-radius:12px;font-weight:700;color:#111;text-decoration:none;margin-bottom:8px;font-size:15px;transition:background .15s}
.nav a:hover{background:var(--blue-xl)}
.nav a.active{background:var(--blue-l);color:var(--blue);margin-left:14px;margin-right:6px;text-align:center}
.side-user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px;border-top:1px solid var(--line);font-size:13px}
.side-user b{display:block;font-size:13px}
.side-user div span{color:var(--muted);font-size:12px}
.topbar{display:none}
.backdrop{display:none}


.main{flex:1;padding:28px 34px 48px;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{margin:0;color:var(--blue);font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1.15}
.page-head h1 a{color:inherit;text-decoration:none}
.page-head h1 a:hover{text-decoration:underline}
.sub{font-size:13px;color:#333;margin-top:5px}
.btn{border:none;border-radius:12px;padding:9px 18px;font-weight:600;background:var(--blue);color:#fff;transition:background .15s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--blue-d)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid #BCD0EA}
.btn.ghost:hover{background:var(--blue-xl)}
.btn.danger{background:var(--red)}.btn.danger:hover{background:#c64545}
.btn.success{background:var(--green)}.btn.success:hover{background:#41a54b}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn.plain{background:none;color:var(--blue);padding:6px 8px}
.btn.plain:hover{background:var(--blue-xl)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.stat{background:#fff;border-radius:12px;padding:10px 16px 12px;border:2px solid transparent;transition:.15s;text-align:left}
.stat:hover{border-color:#BCD0EA;transform:translateY(-1px)}
.stat .l{font-size:11px;color:#333}
.stat .v{font-size:26px;font-weight:700;text-align:center;margin-top:2px;letter-spacing:-.5px}
.stat.primary{background:var(--blue);color:#fff}
.stat.primary .l{color:#E3EEFF}
.stat.primary:hover{border-color:#0d4b9c}

.card{background:#fff;border-radius:var(--r);padding:20px 22px;margin-bottom:18px}
.card h2{margin:0 0 14px;font-size:20px;font-weight:600}
.card h3{margin:0 0 12px;font-size:16px;font-weight:600}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head h2,.card-head h3{margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid2 .card{margin-bottom:0}

table{width:100%;border-collapse:collapse}
th{font-weight:500;color:#555;font-size:12px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
td.num,th.num{text-align:right;white-space:nowrap}
td.c,th.c{text-align:center}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--blue-xl)}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.muted{color:var(--muted)}
.small{font-size:12px}
.nowrap{white-space:nowrap}
.empty{padding:34px 10px;text-align:center;color:var(--muted)}

.pill{display:inline-block;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:600;color:#fff;border:2px solid rgba(0,0,0,.14);white-space:nowrap;line-height:1.3}
.s-draft{background:var(--draft)}.s-approval{background:var(--violet)}.s-planned{background:var(--orange)}
.s-active{background:var(--green)}.s-done{background:var(--grey)}.s-rejected{background:var(--red)}.s-cancelled{background:#9AA3AD}

.av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;flex-shrink:0}
.who{display:flex;align-items:center;gap:10px}
.who .av{width:28px;height:28px;font-size:11px}

.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:#fff;border-radius:20px;padding:5px 12px;font-size:13px;font-weight:500}
.chip span{color:var(--muted);margin-left:2px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.on span{color:#d6e6ff}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.inp{border:1px solid #B8C3CF;border-radius:6px;padding:7px 10px;background:#fff;min-height:36px;width:100%}
.inp:focus{outline:2px solid #9cc2f2;outline-offset:0;border-color:var(--blue)}
.inp.err{border-color:var(--red);background:#fff6f6}
.tools .inp{width:auto;min-width:200px}
textarea.inp{resize:vertical;min-height:70px}
label.f{display:block;font-size:13px;margin-bottom:5px;color:#222}
.field{margin-bottom:12px}
.ferr{color:var(--red);font-size:12px;margin-top:4px;display:none}
.field.bad .ferr{display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.arrow-row{display:grid;grid-template-columns:1fr 40px 1fr;align-items:center;gap:6px}
.arrow-row .ar{text-align:center;font-size:20px;color:#333}
.hint{font-size:11px;color:var(--muted);margin-top:4px}

.form-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
.summary{position:sticky;top:20px}
.summary h3{font-size:17px;font-weight:700;margin:0 0 10px}
.sumrow{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;gap:8px}
.sumrow span:first-child{color:#444}
.sumrow.total{border-top:1px solid #333;margin-top:10px;padding-top:10px;font-weight:700;font-size:15px}
.warn{background:#FFF4E2;color:#8a5600;border-radius:8px;padding:8px 10px;font-size:12px;margin-top:10px}
.okbox{background:#E9F7EB;color:#2b6b32;border-radius:8px;padding:8px 10px;font-size:12px;margin-top:10px}
.summary .btn{margin-top:10px}

.dos-head{display:flex;gap:16px;align-items:center;margin:8px 0 14px}
.dos-av{width:86px;height:86px;border-radius:10px;font-size:28px}
.dos-head .nm{font-weight:600;font-size:15px}
.dos-head div div{font-size:13px;margin-top:3px}
.tabs{display:flex;justify-content:space-between;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:5px 10px;gap:4px;overflow-x:auto}
.tab{background:none;border:none;padding:5px 14px;border-radius:7px;font-size:13px;white-space:nowrap}
.tab:hover{background:var(--blue-xl)}
.tab.on{background:var(--blue);color:#fff}
.dos-grid{display:grid;grid-template-columns:minmax(0,1fr) 250px}
.dos-main{padding:14px 18px 6px 4px}
.dos-side{border-left:1px solid var(--line2);padding:14px 0 6px 16px;font-size:12px}
.dos-side h4{color:var(--blue);text-align:center;margin:0 0 10px;font-weight:600;font-size:14px}
.kv{display:flex;gap:10px;font-size:13px;padding:3px 0}
.kv span:first-child{color:#555;min-width:130px}
.sec-t{font-weight:600;margin:14px 0 6px;font-size:14px}
.sec-t:first-child{margin-top:0}
.st-line{display:flex;justify-content:space-between;padding:3px 0;gap:8px}
.st-line b{font-weight:600}
.gap{height:12px}
.doc-item{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.doc-ic{width:34px;height:40px;border-radius:5px;background:var(--blue-l);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.doc-item .t{flex:1;min-width:0}
.doc-item .t div:first-child{font-weight:500}
.perm{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.perm input{width:18px;height:18px;accent-color:var(--blue)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 14px 22px;font-size:13px}
.timeline li:before{content:"";position:absolute;left:4px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--blue)}
.timeline li:after{content:"";position:absolute;left:8px;top:16px;bottom:0;width:1px;background:var(--line2)}
.timeline li:last-child:after{display:none}
.timeline .d{font-size:11px;color:var(--muted)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.kpi{background:#fff;border-radius:12px;padding:14px 16px}
.kpi .l{font-size:12px;color:#555}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.4px}
.kpi .d{font-size:11px;color:var(--muted);margin-top:2px}
.months{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:20px}
.mcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;min-width:0}
.mbar{width:100%;max-width:36px;background:#B9D3F2;border-radius:6px 6px 2px 2px;position:relative;min-height:2px;transition:background .15s}
.mbar.cur{background:var(--blue)}
.mcol:hover .mbar{background:var(--blue-d)}
.mval{font-size:10px;color:#444;margin-bottom:4px;white-space:nowrap}
.mlab{font-size:11px;color:var(--muted);margin-top:6px}
.hbar{margin-bottom:10px}
.hbar .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;gap:10px}
.hbar .trk{height:10px;background:#EEF3F9;border-radius:6px;overflow:hidden}
.hbar .fill{height:100%;background:var(--blue);border-radius:6px}
.stack{display:flex;height:18px;border-radius:9px;overflow:hidden;margin:6px 0 12px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend b{margin-left:auto;font-weight:600}

.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.set-grid .card{margin-bottom:0}
.switch{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);gap:12px;font-size:13px}
.switch input{appearance:none;width:40px;height:22px;border-radius:12px;background:#C8D1DB;position:relative;cursor:pointer;transition:.2s;flex-shrink:0}
.switch input:before{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked{background:var(--blue)}
.switch input:checked:before{left:21px}

.overlay{position:fixed;inset:0;background:rgba(15,30,50,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;z-index:100;overflow-y:auto;animation:fade .15s}
.modal{background:#fff;border-radius:16px;width:100%;max-width:620px;padding:22px 24px;box-shadow:0 20px 50px rgba(0,0,0,.2);animation:pop .18s}
.modal.wide{max-width:780px}
.modal.narrow{max-width:440px}
.m-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.m-head h2{margin:0;font-size:20px}
.x{background:none;border:none;font-size:24px;line-height:1;color:#777;padding:0 4px}
.x:hover{color:#000}
.m-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin-bottom:14px}
.info-grid .lb{font-size:11px;color:var(--muted)}
.info-grid .vl{font-size:14px;font-weight:500;margin-top:2px}
.costbox{background:var(--blue-xl);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.doc-paper{border:1px solid var(--line2);border-radius:8px;padding:26px 30px;font-family:"Times New Roman",Times,serif;font-size:15px;line-height:1.5;color:#111;background:#fffef9}
.doc-paper h4{text-align:center;margin:12px 0 2px;font-size:16px}
.doc-paper .ctr{text-align:center}
.doc-paper table td,.doc-paper table th{border:1px solid #999;padding:5px 8px;font-size:14px}
.doc-paper .sign{display:flex;justify-content:space-between;margin-top:22px}
.menu{position:fixed;background:#fff;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;z-index:90;min-width:200px;animation:pop .12s}
.menu button{display:block;width:100%;text-align:left;background:none;border:none;padding:8px 12px;border-radius:7px;font-size:13px}
.menu button:hover{background:var(--blue-xl)}
.menu button.del{color:var(--red)}
.dots{background:none;border:none;font-size:18px;padding:2px 8px;border-radius:6px;line-height:1;color:#333}
.dots:hover{background:var(--blue-l)}
.toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#17212D;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;box-shadow:0 8px 20px rgba(0,0,0,.2);animation:pop .2s}
.toast.ok{background:#2D8A3A}.toast.bad{background:#C64545}
.mini-list .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mini-list .it:last-child{border-bottom:none}
.mini-list .grow{flex:1;min-width:0}
.mini-list .grow div:first-child{font-weight:500}
.link{background:none;border:none;color:var(--blue);padding:0;font-weight:500}
.link:hover{text-decoration:underline}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}}

@media (max-width:1100px){
  .stats,.kpis{grid-template-columns:repeat(2,1fr)}
  .dos-grid{grid-template-columns:1fr}
  .dos-side{border-left:none;border-top:1px solid var(--line2);padding:14px 4px}
}
@media (max-width:900px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:none;box-shadow:0 0 30px rgba(0,0,0,.2)}
  .backdrop.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
  .topbar{display:flex;align-items:center;justify-content:space-between;background:#fff;padding:8px 14px;position:sticky;top:0;z-index:20;box-shadow:0 1px 0 var(--line)}
  .topbar .logo{padding:0;font-size:18px}
  .burger{background:none;border:none;font-size:24px;padding:4px 8px}
  .app{flex-direction:column}
  .main{padding:18px 14px 40px}
  .page-head h1{font-size:24px}
  .form-layout,.grid2,.set-grid{grid-template-columns:1fr}
  .summary{position:static}
  .card{padding:16px}
  .tools .inp{min-width:0;flex:1}
  .info-grid{grid-template-columns:1fr}
  .modal{padding:18px}
  .overlay{padding:16px 8px}
  .doc-paper{padding:16px}
}
@media (max-width:480px){
  .stat .v{font-size:22px}
  .row2{grid-template-columns:1fr}
  .tabs{justify-content:flex-start}
  .kv span:first-child{min-width:110px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="logo" href="#home" id="logoTop"></a>
    <button class="burger" data-act="menu-toggle" aria-label="Меню">☰</button>
  </div>
  <div class="backdrop" data-act="menu-toggle"></div>
  <aside class="sidebar" id="sidebar">
    <a class="logo" href="#home" id="logoSide"></a>
    <nav class="nav" id="nav">
      <a href="#home" data-view="home">Главная</a>
      <a href="#trips" data-view="trips">Командировки</a>
      <a href="#employees" data-view="employees">Сотрудники</a>
      <a href="/expenses">Журнал расходов</a>
      <a href="#reports" data-view="reports">Отчёты</a>
      <a href="#config" data-view="config">Настройки</a>
    </nav>
    <div class="side-user" id="sideUser"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toast-wrap" id="toasts"></div>

<script>
const LOGO = `<svg viewBox="0 0 48 34" aria-hidden="true"><path fill="#111" d="M3 27.5c6-1.2 12.5-3.6 19.5-7.4l10.8-6.2c4.3-2.5 8.5-4.4 11-4.6 1.4-.1 1.6.9.6 1.9-1.7 1.7-5.6 4.2-9.6 6.4L24 23.8l-3.6 7.6-2.7.8 1.6-6.5-7 2.9-2.8 2.6-1.8.3 1.1-3.3c-2 .4-4 .3-5.8-.7zM14.5 15.6l2.2-1.3 9.4 1.1-4.6 2.6zM27 9.6l2.5-1.4 3.2 2.6-2.6 1.4z"/></svg>TravelFlow`;
const $ = s => document.querySelector(s);
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fd = s => s ? s.split('-').reverse().join('.') : '—';
const fds = s => { const p = s.split('-'); return p[2]+'.'+p[1]; };
const addDays = (s,n) => { const d = pd(s); d.setDate(d.getDate()+n); return iso(d); };
const diffDays = (a,b) => Math.round((pd(b)-pd(a))/864e5);
const money = n => Math.round(n||0).toLocaleString('ru-RU') + ' ₽';
const plural = (n,f) => { n = Math.abs(n)%100; const n1 = n%10; if (n>10&&n<20) return f[2]; if (n1>1&&n1<5) return f[1]; if (n1===1) return f[0]; return f[2]; };
const daysW = n => n + ' ' + plural(n, ['день','дня','дней']);
const shortMoney = n => n >= 1e6 ? (n/1e6).toFixed(2).replace('.',',') + ' млн ₽' : n >= 1e4 ? Math.round(n/1e3) + ' тыс ₽' : money(n);
const MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_SH = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const fdLong = s => { const d = pd(s); return `«${pad(d.getDate())}» ${MONTHS_GEN[d.getMonth()]} ${d.getFullYear()} г.`; };
const TODAY = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
const T = iso(TODAY);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

const DEPTS = ['Администрация','Бухгалтерия','Клиентский отдел','Отдел дизайна','Отдел маркетинга','Отдел продаж','Технический отдел'];
const ROLES = {employee:'Сотрудник', manager:'Руководитель', accountant:'Бухгалтер', admin:'Администратор'};
const PERMS = {create:'Создание заявок на командировки', approve:'Согласование заявок', reports:'Просмотр отчётов', manage:'Управление сотрудниками'};

const LS = 'travelflow-v1';
let state;
try { state = JSON.parse(localStorage.getItem(LS)); } catch(e) { state = null; }
if (!state || !state.trips) state = seed();
function save(){ try { localStorage.setItem(LS, JSON.stringify(state)); } catch(e) {} }
const ui = {tripFilter:'all', tripSearch:'', tripSort:'date-desc', empSearch:'', empDept:'', dosTab:'overview', period:'month', form:null, menu:false, pendingTrip:null};

const emp = id => state.employees.find(e => e.id === +id);
const trip = id => state.trips.find(t => t.id === +id);
const fio = e => e ? `${e.last} ${e.first} ${e.middle}` : '— удалён —';
const nameShort = e => e ? `${e.first} ${e.last}` : '— удалён —';
const initials = e => e ? (e.first[0] + e.last[0]) : '?';
const avatar = (e, cls='av') => `<span class="${cls}" style="background:${AV_COLORS[(e?.id||0)%AV_COLORS.length]}">${h(initials(e))}</span>`;
const tripNo = t => '№ ' + String(t.id).padStart(3,'0');

function tripDays(t){ return Math.max(0, diffDays(t.start, t.end) + 1); }
function cost(t){
  const d = tripDays(t), n = Math.max(0, d-1);
  const tickets = +t.tickets||0, hotel = (+t.hotelRate||0)*n, perdiem = (+t.perDiem||0)*d;
  return {days:d, nights:n, tickets, hotel, perdiem, total: tickets+hotel+perdiem};
}
const spent = t => t.fact ?? cost(t).total;
function status(t){
  if (t.state !== 'approved') return t.state;
  if (t.start > T) return 'planned';
  if (t.end < T) return 'done';
  return 'active';
}
const pill = t => { const s = STATUS[status(t)]; return `<span class="pill ${s.c}">${s.l}</span>`; };
const route = t => `${h(t.from)} – ${h(t.to)}`;
const dates = t => `${fds(t.start)}–${fds(t.end)}`;
function age(b){ const d = pd(b); let a = TODAY.getFullYear()-d.getFullYear(); const m = TODAY.getMonth()-d.getMonth(); if (m<0 || (m===0 && TODAY.getDate()<d.getDate())) a--; return a; }

function estimateTickets(to, transport){
  if (!to) return 0;
  const km = CITIES[to] ?? 1200;
  const k = {'Самолёт':[6000,7.5], 'Поезд':[2000,7], 'Автобус':[0,5], 'Автомобиль':[0,12.4]}[transport] || [0,7];
  return Math.round((k[0] + km*k[1]) / 100) * 100;
}

function toast(msg, kind=''){
  const el = document.createElement('div'); el.className = 'toast ' + kind; el.textContent = msg;
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), 2800);
}
let onConfirm = null;
function openModal(html, cls=''){
  closeModal();
  const o = document.createElement('div'); o.className = 'overlay'; o.id = 'overlay';
  o.innerHTML = `<div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  o.addEventListener('mousedown', e => { if (e.target === o) closeModal(); });
  document.body.appendChild(o); document.body.classList.add('noscroll');
}
function closeModal(){ const o = $('#overlay'); if (o) o.remove(); document.body.classList.remove('noscroll'); }
const mhead = title => `<div class="m-head"><h2>${title}</h2><button class="x" data-act="close-modal" aria-label="Закрыть">×</button></div>`;
function confirmBox({title, text, ok='Подтвердить', danger=false, input=false, placeholder='', then}){
  onConfirm = then;
  openModal(`${mhead(h(title))}<p style="margin:0 0 10px">${text}</p>
    ${input ? `<div class="field" id="cfField"><textarea class="inp" id="cfInput" placeholder="${h(placeholder)}"></textarea><div class="ferr">Заполните поле</div></div>` : ''}
    <div class="m-actions"><button class="btn ghost" data-act="close-modal">Отмена</button><button class="btn ${danger?'danger':''}" data-act="confirm-ok">${h(ok)}</button></div>`, 'narrow');
  if (input) setTimeout(() => $('#cfInput')?.focus(), 50);
}
function closeMenu(){ document.querySelectorAll('.menu').forEach(m => m.remove()); }
function openMenu(btn, items){
  closeMenu();
  const m = document.createElement('div'); m.className = 'menu';
  m.innerHTML = items.map(i => `<button class="${i.cls||''}" data-act="${i.act}" data-id="${i.id}">${i.label}</button>`).join('');
  document.body.appendChild(m);
  const r = btn.getBoundingClientRect();
  const left = Math.min(window.innerWidth - m.offsetWidth - 8, r.right - m.offsetWidth);
  let top = r.bottom + 4; if (top + m.offsetHeight > window.innerHeight - 8) top = r.top - m.offsetHeight - 4;
  m.style.left = Math.max(8,left) + 'px'; m.style.top = top + 'px';
}

function tripTable(list, {showPurpose=true, showEmp=true, showNo=true} = {}){
  if (!list.length) return `<div class="empty">Командировок не найдено</div>`;
  return `<div class="table-wrap"><table><thead><tr>
    ${showNo?'<th>№</th>':''}${showEmp?'<th>Сотрудник</th>':''}<th>Направление</th><th>Дата</th>${showPurpose?'<th>Цель</th>':''}<th class="num">Бюджет</th><th class="c">Статус</th></tr></thead><tbody>
    ${list.map(t => { const e = emp(t.emp); return `<tr class="click" data-act="open-trip" data-id="${t.id}">
      ${showNo?`<td class="muted">${String(t.id).padStart(3,'0')}</td>`:''}
      ${showEmp?`<td><div class="who">${avatar(e)}<span>${h(nameShort(e))}</span></div></td>`:''}
      <td class="nowrap">${route(t)}</td><td class="nowrap">${dates(t)}</td>
      ${showPurpose?`<td>${h(t.purpose)}</td>`:''}
      <td class="num">${money(cost(t).total)}</td><td class="c">${pill(t)}</td></tr>`; }).join('')}
    </tbody></table></div>`;
}

      <div class="mini-list">${pending.length ? pending.map(t => { const e = emp(t.emp); return `<div class="it">${avatar(e)}
        <div class="grow"><div><button class="link" data-act="open-trip" data-id="${t.id}">${h(nameShort(e))}</button></div><div class="small muted">${route(t)} · ${dates(t)} · ${money(cost(t).total)}</div></div>

      <div class="mini-list">${upcoming.length ? upcoming.map(t => { const e = emp(t.emp); const dd = diffDays(T,t.start); return `<div class="it">${avatar(e)}
        <div class="grow"><div><button class="link" data-act="open-trip" data-id="${t.id}">${h(nameShort(e))}</button></div><div class="small muted">${route(t)} · ${dates(t)}</div></div>

function filteredTrips(){
  const q = ui.tripSearch.trim().toLowerCase();
  let list = state.trips.filter(t => ui.tripFilter === 'all' || status(t) === ui.tripFilter);
  if (q) list = list.filter(t => [fio(emp(t.emp)), t.from, t.to, t.purpose, emp(t.emp)?.dept].join(' ').toLowerCase().includes(q));
  const s = ui.tripSort;
  list.sort((a,b) => s==='date-asc' ? a.start.localeCompare(b.start) : s==='budget-desc' ? cost(b).total-cost(a).total : s==='budget-asc' ? cost(a).total-cost(b).total : b.start.localeCompare(a.start));
  return list;
}
function viewTrips(){
  const counts = {}; state.trips.forEach(t => { const s = status(t); counts[s] = (counts[s]||0)+1; });
  const chips = [['all','Все',state.trips.length],['draft','Черновики'],['approval','На согласовании'],['planned','Запланированы'],['active','В пути'],['done','Завершены'],['rejected','Отклонены'],['cancelled','Отменены']];
  const list = filteredTrips();
  return `
  <div class="page-head"><div><h1>Командировки</h1><div class="sub">Все заявки и поездки сотрудников</div></div>
    <button class="btn" data-act="new-trip">+ новая командировка</button></div>

        ${[['date-desc','Сначала новые'],['date-asc','Сначала старые'],['budget-desc','Бюджет: по убыванию'],['budget-asc','Бюджет: по возрастанию']].map(([v,l]) => `<option value="${v}" ${ui.tripSort===v?'selected':''}>${l}</option>`).join('')}

  </div>`;
}

function tripModal(id){
  const t = trip(id); if (!t) return;
  const e = emp(t.emp), c = cost(t), s = status(t);
  const btn = (act,label,cls='') => `<button class="btn ${cls}" data-act="${act}" data-id="${t.id}">${label}</button>`;
  let actions = '';
  if (s==='draft') actions = btn('delete-trip','Удалить','ghost') + btn('edit-trip','Редактировать','ghost') + btn('submit','Отправить на согласование');
  else if (s==='approval') actions = btn('edit-trip','Редактировать','ghost') + btn('reject','Отклонить','danger') + btn('approve','Согласовать','success');
  else if (s==='planned') actions = btn('cancel-trip','Отменить поездку','ghost');
  else if (s==='active') actions = btn('finish-trip','Завершить досрочно','ghost');
  else if (s==='rejected' || s==='cancelled') actions = btn('delete-trip','Удалить','ghost') + btn('edit-trip','Исправить и подать снова');
  else if (s==='done') actions = btn('open-doc-trip','Авансовый отчёт','ghost');
  let factBlock = '';
  if (s==='done') {
    factBlock = t.fact != null
      ? `<div class="${t.fact<=c.total?'okbox':'warn'}" style="margin:0 0 14px">Фактические расходы: <b>${money(t.fact)}</b> — ${t.fact<=c.total ? 'экономия ' + money(c.total-t.fact) : 'перерасход ' + money(t.fact-c.total)}</div>`
      : `<div class="field" id="factField"><label class="f">Фактические расходы по авансовому отчёту, ₽</label>

function renderSummary(){
  const f = ui.form, box = $('#summary'); if (!f || !box) return;
  const valid = f.start && f.end && f.end >= f.start;
  const c = valid ? cost(f) : {days:0,nights:0,tickets:+f.tickets||0,hotel:0,perdiem:0,total:+f.tickets||0};
  const e = emp(f.emp);
  let note = '';
  if (e) {
    const used = state.trips.filter(t => t.emp===e.id && t.state==='approved' && t.id!==f.id && pd(t.start).getFullYear()===TODAY.getFullYear()).reduce((a,t)=>a+spent(t),0);
    const rest = e.limit - used;
    note = c.total > rest ? `<div class="warn">Превышение годового лимита сотрудника на ${money(c.total-rest)} (остаток ${money(Math.max(0,rest))})</div>` : `<div class="okbox">В пределах лимита. Остаток после поездки: ${money(rest-c.total)}</div>`;
  }
  if (+f.hotelRate > state.settings.hotelLimit) note += `<div class="warn">Стоимость проживания выше лимита ${money(state.settings.hotelLimit)} за ночь</div>`;
  const auto = state.settings.autoApprove && c.total <= state.settings.autoLimit;
  box.innerHTML = `<h3>ИТОГ</h3>
    <div class="sumrow"><span>Длительность</span><span>${daysW(c.days)}</span></div>
    <div class="sumrow"><span>Билеты</span><span>${money(c.tickets)}</span></div>
    <div class="sumrow"><span>Проживание</span><span>${money(c.hotel)}</span></div>
    <div class="sumrow"><span>Суточные</span><span>${money(c.perdiem)}</span></div>
    <div class="sumrow total"><span>Итого</span><span>${money(c.total)}</span></div>
    ${note}
    ${auto ? '<div class="hint" style="margin-top:8px">Сумма в пределах автосогласования — заявка будет согласована сразу</div>' : ''}`;
  const b = $('#budgetField'); if (b) b.value = money(c.total);
}
function formInput(el){
  const f = ui.form, k = el.dataset.field; if (!f) return;
  f[k] = el.value;
  if (k === 'tickets') { f.touched = true; const hint = el.parentElement.querySelector('.hint'); if (hint) hint.textContent = 'Введено вручную'; }
  if ((k === 'to' || k === 'transport') && !f.touched) {
    f.tickets = estimateTickets(f.to, f.transport);
    const ti = document.querySelector('[data-field="tickets"]'); if (ti) ti.value = f.tickets || '';
  }
  if (k === 'start' && f.end && f.end < f.start) { f.end = f.start; document.querySelector('[data-field="end"]').value = f.end; }
  el.closest('.field')?.classList.remove('bad');
  renderSummary();
}
function validateForm(){
  const f = ui.form; let ok = true;
  const mark = (k, bad) => { const el = document.querySelector(`[data-req="${k}"]`); el?.classList.toggle('bad', bad); if (bad) ok = false; };
  mark('emp', !f.emp);
  mark('route', !f.from.trim() || !f.to.trim() || f.from.trim().toLowerCase() === f.to.trim().toLowerCase());
  mark('dates', !f.start || !f.end || f.end < f.start);
  mark('purpose', !f.purpose.trim());
  if (!ok) { toast('Проверьте обязательные поля', 'bad'); document.querySelector('.field.bad')?.scrollIntoView({behavior:'smooth', block:'center'}); }
  return ok;
}
function saveForm(asDraft){
  if (!asDraft && !validateForm()) return;
  const f = ui.form;
  if (asDraft && !f.emp) { document.querySelector('[data-req="emp"]').classList.add('bad'); toast('Для черновика выберите сотрудника','bad'); return; }
  if (asDraft && (!f.end || f.end < f.start)) { validateForm(); return; }
  const data = {emp:+f.emp, from:f.from.trim(), to:f.to.trim() || '—', start:f.start, end:f.end, purpose:f.purpose.trim() || 'Не указана', transport:f.transport,
    tickets:+f.tickets||0, hotelRate:+f.hotelRate||0, perDiem:+f.perDiem||state.settings.perDiem, comment:f.comment.trim()};
  let t;
  if (f.id) { t = trip(f.id); Object.assign(t, data); t.reason = ''; t.history.push({d:T, t:'Заявка изменена'}); }
  else { t = {id: ++state.seq.trip, ...data, state:'draft', fact:null, reason:'', created:T, history:[{d:T, t:'Заявка создана'}]}; state.trips.push(t); }
  if (asDraft) { t.state = 'draft'; toast('Черновик сохранён'); }
  else submitTrip(t, true);
  ui.form = null; save();
  ui.tripFilter = 'all'; ui.pendingTrip = t.id; go('trips');
}
function submitTrip(t, quiet){
  t.history.push({d:T, t:'Отправлена на согласование'});
  if (state.settings.autoApprove && cost(t).total <= state.settings.autoLimit) {
    t.state = 'approved'; t.history.push({d:T, t:'Согласовано автоматически (сумма до ' + money(state.settings.autoLimit) + ')'});
    toast('Заявка согласована автоматически', 'ok');
  } else { t.state = 'approval'; toast(quiet ? 'Заявка отправлена на согласование' : 'Отправлено на согласование', 'ok'); }
}

function empStats(e){
  const y = TODAY.getFullYear();
  const all = state.trips.filter(t => t.emp === e.id);
  const real = all.filter(t => t.state === 'approved');
  const year = real.filter(t => pd(t.start).getFullYear() === y);
  const daysYear = year.filter(t => t.start <= T).reduce((a,t) => a + diffDays(t.start, t.end < T ? t.end : T) + 1, 0);
  const spentYear = year.reduce((a,t) => a + spent(t), 0);
  const avg = real.length ? real.reduce((a,t) => a + spent(t), 0) / real.length : 0;
  const active = real.find(t => status(t) === 'active');
  const dest = {}; real.forEach(t => dest[t.to] = (dest[t.to]||0) + 1);
  const recent = [...real].sort((a,b) => b.start.localeCompare(a.start)).map(t => t.to).filter((v,i,a) => a.indexOf(v)===i).slice(0,3);
  return {all, real, daysYear, spentYear, rest: e.limit - spentYear, avg, active, dest, recent};
}

function periodRange(p){
  const y = TODAY.getFullYear(), m = TODAY.getMonth(), q = Math.floor(m/3);
  if (p === 'month') return [iso(new Date(y,m,1)), iso(new Date(y,m+1,0)), `${cap(MONTHS[m])} ${y}`];
  if (p === 'quarter') return [iso(new Date(y,q*3,1)), iso(new Date(y,q*3+3,0)), `${['I','II','III','IV'][q]} квартал ${y}`];
  if (p === 'year') return [`${y}-01-01`, `${y}-12-31`, `${y} год`];
  return ['0000-01-01','9999-12-31','За всё время'];
}
function reportData(){
  const [a,b,label] = periodRange(ui.period);
  const list = state.trips.filter(t => t.state === 'approved' && t.start >= a && t.start <= b);
  return {list, label};
}

function exportCsv(){

  $('#main').innerHTML = views[v]();
  const navKey = v === 'new' ? 'trips' : v === 'dossier' ? 'employees' : v;
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.view === navKey));
  if (v === 'new') renderSummary();
  $('#sidebar').classList.remove('open'); document.querySelector('.backdrop').classList.remove('open');
  const titles = {home:'Главная', trips:'Командировки', new:'Новая командировка', employees:'Сотрудники', reports:'Отчёты', config:'Настройки', dossier:'Досье'};
  document.title = titles[v] + ' — TravelFlow';
  if (ui.pendingTrip) { const pid = ui.pendingTrip; ui.pendingTrip = null; tripModal(pid); }
}
function go(view){ if (location.hash === '#'+view) render(); else location.hash = '#'+view; }
function after(id){ save(); render(); if (id) tripModal(id); }

const ACT = {
  'noop': (el,id,e) => e.stopPropagation(),
  'go': el => go(el.dataset.to),
  'menu-toggle': () => { $('#sidebar').classList.toggle('open'); document.querySelector('.backdrop').classList.toggle('open'); },
  'close-modal': () => closeModal(),
  'confirm-ok': () => {
    const inp = $('#cfInput');
    if (inp && !inp.value.trim()) { $('#cfField').classList.add('bad'); return; }
    const fn = onConfirm; const val = inp ? inp.value.trim() : null; closeModal(); fn && fn(val);
  },
  'new-trip': el => { closeModal(); ui.form = blankForm(el.dataset.emp); go('new'); },
  'trip-filter': el => { ui.tripFilter = el.dataset.k; ui.tripSearch = ''; go('trips'); },
  'open-trip': (el,id) => tripModal(id),
  'approve': (el,id) => { const t = trip(id); t.state = 'approved'; t.history.push({d:T, t:'Согласовано: ' + state.settings.userName}); toast('Командировка согласована','ok'); const inModal = !!$('#overlay'); save(); render(); if (inModal) tripModal(id); },
  'reject': (el,id) => confirmBox({title:'Отклонить заявку', text:`Командировка ${tripNo(trip(id))}: ${h(nameShort(emp(trip(id).emp)))}, ${route(trip(id))}. Укажите причину — её увидит сотрудник.`, ok:'Отклонить', danger:true, input:true, placeholder:'Причина отклонения',
    then: r => { const t = trip(id); t.state = 'rejected'; t.reason = r; t.history.push({d:T, t:'Отклонено: ' + r}); toast('Заявка отклонена','bad'); after(id); }}),
  'submit': (el,id) => { submitTrip(trip(id)); after(id); },
  'cancel-trip': (el,id) => confirmBox({title:'Отменить поездку?', text:'Командировка будет отменена, бюджет освободится.', ok:'Отменить поездку', danger:true,
    then: () => { const t = trip(id); t.state = 'cancelled'; t.history.push({d:T, t:'Командировка отменена'}); toast('Поездка отменена'); after(id); }}),
  'finish-trip': (el,id) => confirmBox({title:'Завершить досрочно?', text:'Дата окончания будет изменена на сегодня, смета пересчитается.', ok:'Завершить',
    then: () => { const t = trip(id); t.end = T < t.start ? t.start : addDays(T,-1) < t.start ? t.start : addDays(T,-1); t.history.push({d:T, t:'Командировка завершена досрочно'}); toast('Командировка завершена','ok'); after(id); }}),
  'delete-trip': (el,id) => confirmBox({title:'Удалить заявку?', text:`Командировка ${tripNo(trip(id))} будет удалена без возможности восстановления.`, ok:'Удалить', danger:true,
    then: () => { state.trips = state.trips.filter(t => t.id !== id); toast('Заявка удалена'); save(); render(); }}),
  'edit-trip': (el,id) => { const t = trip(id); closeModal(); ui.form = {id:t.id, emp:String(t.emp), from:t.from, to:t.to==='—'?'':t.to, start:t.start, end:t.end, purpose:t.purpose, transport:t.transport, tickets:t.tickets, hotelRate:t.hotelRate, perDiem:t.perDiem, comment:t.comment, touched:true}; go('new'); },
  'set-fact': (el,id) => { const v = +$('#factInput').value; if (!$('#factInput').value || v < 0) { $('#factField').classList.add('bad'); return; }
    const t = trip(id); t.fact = v; t.history.push({d:T, t:'Авансовый отчёт принят: ' + money(v)}); toast('Фактические расходы сохранены','ok'); after(id); },
  'open-doc-trip': (el,id) => docModal(id,'report'),
  'open-doc': (el,id) => docModal(id, el.dataset.kind),
  'copy-doc': async () => { try { await navigator.clipboard.writeText($('#docPaper').innerText); toast('Текст документа скопирован','ok'); } catch(e) { toast('Не удалось скопировать — выделите текст вручную','bad'); } },
  'copy-csv': async () => { const ta = $('#csvText'); try { await navigator.clipboard.writeText(ta.value); toast('CSV скопирован','ok'); } catch(e) { ta.select(); toast('Текст выделен — скопируйте вручную','bad'); } },
  'export-csv': () => exportCsv(),
  'form-submit': () => saveForm(false),
  'form-draft': () => saveForm(true),
  'form-cancel': () => { const id = ui.form?.id; ui.form = null; if (id) ui.pendingTrip = id; go('trips'); },
  'open-emp': (el,id) => { closeModal(); closeMenu(); location.hash = '#employee-' + id; },
  'emp-menu': (el,id) => openMenu(el, [
    {act:'open-emp', id, label:'Открыть досье'}, {act:'menu-new-trip', id, label:'Новая командировка'},
    {act:'edit-emp', id, label:'Изменить данные'}, {act:'delete-emp', id, label:'Удалить сотрудника', cls:'del'}]),
  'menu-new-trip': (el,id) => { closeMenu(); ui.form = blankForm(id); go('new'); },
  'new-emp': () => empForm(null),
  'edit-emp': (el,id) => { closeMenu(); empForm(id); },
  'save-emp': el => saveEmp(+el.dataset.id || null),
  'delete-emp': (el,id) => { closeMenu(); const e = emp(id); const n = state.trips.filter(t => t.emp === id).length;
    confirmBox({title:'Удалить сотрудника?', text:`${h(fio(e))} будет удалён(а) из системы${n ? `, вместе с ${n} ${plural(n,['командировкой','командировками','командировками'])}` : ''}.`, ok:'Удалить', danger:true,
      then: () => { state.employees = state.employees.filter(x => x.id !== id); state.trips = state.trips.filter(t => t.emp !== id); save(); toast('Сотрудник удалён'); go('employees'); }}); },
  'dos-tab': el => { ui.dosTab = el.dataset.k; render(); },
  'save-access': (el,id) => { const e = emp(id); const old = e.role;
    e.role = $('#accRole').value; e.perms = [...document.querySelectorAll('[data-perm]')].filter(x => x.checked).map(x => x.dataset.perm); e.limit = +$('#accLimit').value || 0;
    e.log.push({d:T, t: old !== e.role ? `Роль изменена: ${ROLES[old]} → ${ROLES[e.role]}` : 'Права доступа обновлены'}); save(); toast('Доступ обновлён','ok'); render(); },
  'save-settings': () => { const s = state.settings;
    document.querySelectorAll('[data-set]').forEach(el => { const k = el.dataset.set; s[k] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? (+el.value||0) : el.value.trim() || s[k]; });
    save(); renderUser(); toast('Настройки сохранены','ok'); },
  'reset-data': () => confirmBox({title:'Сбросить данные?', text:'Все изменения будут удалены, вернутся исходные демо-данные.', ok:'Сбросить', danger:true,
    then: () => { state = seed(); save(); ui.form = null; renderUser(); toast('Данные сброшены'); go('home'); }})
};

document.addEventListener('click', e => {
  if (!e.target.closest('.menu') && !e.target.closest('[data-act="emp-menu"]')) closeMenu();
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'A' && el.dataset.act !== 'noop') e.preventDefault();
  const fn = ACT[el.dataset.act]; if (fn) fn(el, el.dataset.id ? +el.dataset.id : null, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.field) formInput(el);
  if (el.dataset.search === 'trips') { ui.tripSearch = el.value; const l = filteredTrips(); $('#tripsTable').innerHTML = tripTable(l) + `<div class="small muted" style="margin-top:10px">Показано: ${l.length} · на сумму ${money(l.reduce((a,t)=>a+cost(t).total,0))}</div>`; }
  if (el.dataset.search === 'emps') { ui.empSearch = el.value; $('#empTable').innerHTML = empTableHtml(); }
  if (el.closest('.field.bad') && !el.dataset.field) el.closest('.field').classList.remove('bad');
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.field) formInput(el);
  if (el.dataset.sel === 'tripSort') { ui.tripSort = el.value; render(); }
  if (el.dataset.sel === 'empDept') { ui.empDept = el.value; $('#empTable').innerHTML = empTableHtml(); }
  if (el.dataset.sel === 'period') { ui.period = el.value; render(); }
  if (el.id === 'accRole') { const p = ROLE_PERMS[el.value]; document.querySelectorAll('[data-perm]').forEach(x => x.checked = p.includes(x.dataset.perm)); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenu(); closeModal(); } });
window.addEventListener('hashchange', () => { closeModal(); render(); });
window.addEventListener('scroll', closeMenu, true);

function renderUser(){
  const n = state.settings.userName || 'Пользователь';
  const ini = n.split(/\s+/).map(w => w[0]).join('').slice(0,2).toUpperCase();
  $('#sideUser').innerHTML = `<span class="av" style="background:var(--blue)">${h(ini)}</span><div><b>${h(n)}</b><span>${h(state.settings.company)}</span></div>`;
}
$('#logoTop').innerHTML = LOGO; $('#logoSide').innerHTML = LOGO;
renderUser(); render();
</script>
</body>
</html>
